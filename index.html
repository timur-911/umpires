<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>UMPIR.ES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cyan rounded top bar (from the owner's wireframe), single 1180px column, cards only where an object is meant (search, pyramid, profile). Badge colours (white / blue / gold) carry meaning everywhere. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --sunk:#e9eff1; --ink:#0c1d26; --muted:#566a75; --line:#d5dfe3;
  --brand:#38dfea; --on-brand:#062a31; --brand-ink:#0b6b75;
  --wb:#ffffff; --wb-line:#9fb0b8; --bb:#2459c9; --gb:#c69523; --gb-soft:#f6ecd2; --bb-soft:#e0e9fb;
  --focus:#0b6b75;
  --g-f:#f19cbb; --g-m:#56b4e9;
  --map-sea:#eaf1f3; --map-border:#ffffff; --ch0:#d9e2e6; --ch1:#b9ecf0; --ch2:#62cfd9; --ch3:#1b95a2; --ch4:#0a5862;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1418; --surface:#101e24; --sunk:#16262d; --ink:#e4eef1; --muted:#8fa3ad; --line:#223740;
  --brand:#38dfea; --on-brand:#062a31; --brand-ink:#7fe9f1;
  --wb:#dfe7ea; --wb-line:#7d919a; --bb:#6c97ff; --gb:#e3b54e; --gb-soft:#3a3018; --bb-soft:#1b2a4a; --focus:#7fe9f1; --g-f:#f4a7c4; --g-m:#6cc2f0;
  --map-sea:#0d1a20; --map-border:#0a1418; --ch0:#1f3038; --ch1:#1c4b54; --ch2:#227984; --ch3:#33b6c3; --ch4:#9af0f6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1418; --surface:#101e24; --sunk:#16262d; --ink:#e4eef1; --muted:#8fa3ad; --line:#223740;
  --brand:#38dfea; --on-brand:#062a31; --brand-ink:#7fe9f1;
  --wb:#dfe7ea; --wb-line:#7d919a; --bb:#6c97ff; --gb:#e3b54e; --gb-soft:#3a3018; --bb-soft:#1b2a4a; --focus:#7fe9f1; --g-f:#f4a7c4; --g-m:#6cc2f0;
  --map-sea:#0d1a20; --map-border:#0a1418; --ch0:#1f3038; --ch1:#1c4b54; --ch2:#227984; --ch3:#33b6c3; --ch4:#9af0f6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
/* one H1 size on every page; sized so the home line "Share your experience." nearly fills the left hero card (curator 01.11.2026) */
:root{--h1fs:min(33.9px,calc(3.296vw - 6.56px))}
@media (max-width:900px){:root{--h1fs:min(48px,calc(8.57vw - 8.4px))}}
h1{font-size:var(--h1fs);line-height:1.25}
h2{font-size:28px}
h3{font-size:20px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);border-radius:16px;display:flex;align-items:center;gap:20px;padding:10px 14px 10px 20px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;text-decoration:none}
.logo span{opacity:.55}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.nav a{text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(6,42,49,.1)}
.nav a[aria-current="page"]{background:var(--on-brand);color:var(--brand)}
.nav .soon{opacity:.6}
.nav .dd{position:relative;display:inline-flex}
.nav .ddb{font:inherit;font-weight:500;font-size:14px;color:inherit;background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nav .ddb:hover,.nav .ddb[aria-expanded="true"]{background:rgba(6,42,49,.1)}
.nav .ddb[aria-current="page"]{background:var(--on-brand);color:var(--brand)}
.nav .ddb svg{transition:transform .15s}
.nav .ddb[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav .ddm{position:absolute;top:calc(100% + 6px);left:0;z-index:50;min-width:200px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column;gap:2px}
.nav .ddm[hidden]{display:none}
.nav .ddm::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
.nav .ddm a{padding:8px 10px;border-radius:8px;white-space:nowrap;color:var(--ink)}
.nav .ddm a:hover{background:var(--sunk)}
.nav .ddm a[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:600}
.nav .ddm .ddall{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;border-radius:0 0 8px 8px}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:8px 14px;border:1.5px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.btn.solid{background:var(--on-brand);color:var(--brand);border-color:var(--on-brand)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
main{margin-top:24px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap;border:1.5px solid}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.b0{color:var(--muted);border-color:var(--wb-line);background:var(--surface)}
.b0::before{background:var(--wb);box-shadow:0 0 0 1.5px var(--wb-line)}
.b1{color:var(--bb);border-color:var(--bb);background:var(--bb-soft)}
.b2{color:var(--gb);border-color:var(--gb);background:var(--gb-soft)}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.hero .lead{font-size:17px;max-width:46ch;margin:14px 0 22px;color:var(--muted)}
.lead .dl{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dashed;text-decoration-thickness:1px;text-underline-offset:4px}
.lead .dl:hover{color:var(--brand-ink)}
.h1l{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.rot{display:inline-block;position:relative;vertical-align:top;height:1.25em;overflow:hidden;transition:width .45s ease}
.rot .rw{position:absolute;left:0;top:0;white-space:nowrap;transform:translateY(100%);opacity:0;transition:transform .45s ease,opacity .45s ease}
.rot .rw.in{transform:none;opacity:1}
.rot .rw.out{transform:translateY(-100%);opacity:0}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:14px 16px 14px 44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.search input:focus{border-color:var(--brand-ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:10;max-height:360px;overflow:auto;padding:6px}
.results a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none}
.results a:hover,.results a.on{background:var(--sunk)}
.results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.hint button{font:inherit;color:var(--brand-ink);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
/* pyramid */
.pyr{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.pyr .row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px}
.pyr .lab{font-size:13px;font-weight:600;text-align:right}
.pyr .track{display:flex;justify-content:center;align-items:center;gap:8px;position:relative;height:34px}
.pyr .seg{height:34px;border-radius:6px;min-width:3px}
.pyr .val{font-family:var(--f-display);font-size:22px;font-weight:600}
.pyr .note{font-size:12px;color:var(--muted);margin-top:14px}
/* map */
.mapcard{display:flex;flex-direction:column}
.mapbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.tabs{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.zoom button{font:inherit;font-size:18px;line-height:1;width:34px;height:32px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button:hover{background:var(--sunk)}
.map{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:var(--map-sea)}
.map svg{display:block;width:100%;height:auto;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.map svg.drag{cursor:grabbing}
.ct{stroke:var(--map-border);stroke-width:.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.q0{fill:var(--ch0)}.q1{fill:var(--ch1)}.q2{fill:var(--ch2)}.q3{fill:var(--ch3)}.q4{fill:var(--ch4)}
.ct[class*="q"]:not(.q0){cursor:pointer}
.ct.on{stroke:var(--ink);stroke-width:1.6}
.dt{stroke:var(--surface);stroke-width:1.2}
.dt.on{stroke:var(--ink);stroke-width:2}
.mapfoot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:11px;color:var(--muted);margin-top:8px}
.maphint{text-align:left}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:10px 12px;min-width:160px;font-size:13px;z-index:5}
.tip .tblock+.tblock{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.tip .tn{font-weight:600;display:flex;gap:6px;align-items:center}
.tip .tt{color:var(--muted);margin:2px 0 6px}
.tip .tr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.tip .tgo{font-size:11px;color:var(--muted);margin-top:8px}
.maplegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.maplegend .lg{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;border:1px solid var(--map-border)}
.sw.q0{background:var(--ch0)}.sw.q1{background:var(--ch1)}.sw.q2{background:var(--ch2)}.sw.q3{background:var(--ch3)}.sw.q4{background:var(--ch4)}
.sw.round{width:9px;height:9px;border-radius:50%;border-color:var(--surface)}
@media (max-width:560px){.maphint{display:none}}
/* stats line */
.statline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:baseline;margin:28px 4px 8px;font-size:18px}
.statline b{font-family:var(--f-display);font-size:26px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.fact{background:var(--surface);padding:16px 18px}
.fact .v{font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1}
.fact .k{font-size:13px;color:var(--muted);margin-top:6px}
.section{margin-top:40px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:98px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed .d{white-space:nowrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px}
.feed a{font-weight:600;text-decoration:none}
.feed a:hover{text-decoration:underline}
/* stacked bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bars .r{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bars .r a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .r a:hover{text-decoration:underline}
.bars .t{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bars .t span{display:block;height:100%}
.bars .n{text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.s0{background:var(--wb);box-shadow:inset 0 0 0 1px var(--wb-line)}.s1{background:var(--bb)}.s2{background:var(--gb)}
/* countries A-Z */
.az{columns:4 220px;column-gap:28px}
.az .L{break-inside:avoid;margin-bottom:16px}
.az .L h4{font-family:var(--f-display);font-size:22px;margin:0 0 4px;color:var(--brand-ink)}
.az a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;padding:2px 0;font-size:14px}
.az a:hover span:first-child{text-decoration:underline}
.az a .num{color:var(--muted);font-size:12px}
.az a.z{opacity:.5}
tr.ina td{color:var(--muted)}
tr.ina td a{color:inherit}
.inam{font-size:12px;color:var(--muted);margin-left:4px}
.az a.z:hover{opacity:.85}
/* list view */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.controls input,.controls select{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.controls input{flex:1 1 240px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-top:1px solid var(--line);white-space:nowrap}
tr:first-child td{border-top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
td a{text-decoration:none;font-weight:500}
.more{display:flex;justify-content:center;margin-top:14px}
/* profile */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted)}
.phead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center}
.avatar{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:40px;font-weight:600;background:var(--sunk);border:5px solid var(--wb-line)}
.avatar.l1{border-color:var(--bb)}.avatar.l2{border-color:var(--gb)}
.phead .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.ladder{list-style:none;margin:18px 0 0;padding:0;position:relative}
.ladder>li{display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:18px;position:relative}
.ladder>li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.ladder>li:last-child::before{display:none}
.ladder .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.ladder .done .dot{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.ladder .cur .dot.l1{background:var(--bb);border-color:var(--bb);color:#fff}
.ladder .cur .dot.l2{background:var(--gb);border-color:var(--gb);color:#1c1405}
.ladder .cur .dot.l0{background:var(--wb);border-color:var(--wb-line);color:var(--ink)}
.ladder .cur .dot.lr{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--bg)}
.ladder .og .dot{border-color:var(--brand-ink);background:color-mix(in srgb,var(--brand) 25%,var(--surface));color:var(--brand-ink)}
.ladder .t{font-weight:600}
.ladder .s{font-size:13px;color:var(--muted)}
.ladder .next .t{color:var(--muted)}
.req{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.req li{margin:3px 0}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.colleagues{display:flex;flex-direction:column}
.colleagues a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);text-decoration:none;font-size:14px}
.colleagues a:first-child{border-top:0}
.colleagues a:hover span:first-child{text-decoration:underline}
.own{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap}
.locnote{margin-top:16px;padding:14px 16px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg)}
.locnote p{margin:0;font-size:14px;color:var(--muted)}
.locnote .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.modal textarea{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:70px;resize:vertical}
.modal .two{display:flex;gap:10px}.modal .two>div{flex:1}
.mysubs{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--sunk);font-size:13px}
.mysubs b{display:block;margin-bottom:4px}
.stt{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.stt.s-pending{background:var(--gb-soft);color:var(--gb)}
.stt.s-accepted{background:var(--bb-soft);color:var(--bb)}
.ibh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fn{font-size:10px;color:var(--muted);margin-left:2px;font-family:var(--f-mono)}
.srcnote{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5}
.srcnote a{color:inherit}
.srcmark{font-style:italic}
.src a{color:inherit}

function searchOff(q,limit=8){
  q=q.trim().toLowerCase(); if(!q) return [];
  const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const nq=norm(q);
  if(/^\d+$/.test(q)) return OFF.filter(o=>String(o.iu).startsWith(String(+q))).slice(0,limit);
  const hits=[];
  for(const o of PEOPLE){ const a=norm(o.sur+" "+o.first+(o.aka?" "+o.aka:"")), b=norm(o.first+" "+o.sur);
    if(a.startsWith(nq)||b.startsWith(nq)) hits.unshift(o); else if(a.includes(nq)) hits.push(o);
    if(hits.length>200) break; }
  return hits.slice(0,limit);
}

function wireMap(){

    g.querySelectorAll("circle.dt").forEach(c=>c.setAttribute("r",(3.2/Math.sqrt(mapView.k)).toFixed(2)));

    const step=now=>{const p=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-p,3);
      const k=s.k*Math.pow(t.k/s.k,e);const f=(k-s.k)/((t.k-s.k)||1);
      mapView.k=k;mapView.tx=s.tx+(t.tx-s.tx)*(Math.abs(t.k-s.k)>1e-6?f:e);mapView.ty=s.ty+(t.ty-s.ty)*(Math.abs(t.k-s.k)>1e-6?f:e);apply();if(p<1)anim=requestAnimationFrame(step);};
    anim=requestAnimationFrame(step);};

function wireGanttCountry(){
  const inp=$("#gctry"),lst=$("#gctryList"),btn=$("#gctryBtn"),wrap=inp.parentElement,S=ganttState,t=T();
  const norm=s=>s.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const all=ganttCountries(); let items=[],hi=-1;
  const nameOf=c=>(all.find(x=>x.code===c)||{}).name||"";
  const draw=q=>{const v=norm(q.trim());
    items=[{code:"",name:t.g_ctry_all,n:new Set(GANTT.map(r=>r[0])).size},...all.filter(c=>!v||norm(c.name).includes(v)||norm(c.code).includes(v))];
    if(v)items=items.slice(1);
    hi=items.findIndex(c=>c.code===S.ctry&&!v);
    lst.innerHTML=items.length?items.map((c,i)=>`<button type="button" role="option" data-i="${i}" aria-selected="${c.code===S.ctry}" class="${i===hi?"on":""}"><span>${esc(c.name)}${c.code?` <span class="m">${c.code}</span>`:""}</span><span class="m">${c.n}</span></button>`).join(""):`<div class="m" style="padding:8px 12px">${t.ev_none}</div>`;
    lst.hidden=false;inp.setAttribute("aria-expanded","true");};
  const close=()=>{lst.hidden=true;inp.setAttribute("aria-expanded","false");inp.value=S.ctry?nameOf(S.ctry):"";};
  const pick=c=>{S.ctry=c.code;close();renderGantt();};
  const mark=()=>lst.querySelectorAll("button").forEach((b,i)=>{b.classList.toggle("on",i===hi);if(i===hi)b.scrollIntoView({block:"nearest"});});
  inp.onfocus=()=>{inp.select();draw("");};
  inp.onclick=()=>{if(lst.hidden)draw("");};
  inp.oninput=()=>{if(!inp.value&&S.ctry){S.ctry="";renderGantt();}draw(inp.value);};
  btn.onmousedown=e=>e.preventDefault();
  btn.onclick=()=>{if(lst.hidden){inp.focus();draw("");}else close();};
  lst.onmousedown=e=>e.preventDefault();
  lst.onclick=e=>{const b=e.target.closest("[data-i]");if(b)pick(items[+b.dataset.i]);};
  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();if(lst.hidden)draw("");hi=Math.min(items.length-1,hi+1);mark();}
    else if(e.key==="ArrowUp"){e.preventDefault();hi=Math.max(0,hi-1);mark();}
    else if(e.key==="Enter"){e.preventDefault();const c=items[hi>=0?hi:0];if(c&&!lst.hidden)pick(c);}
    else if(e.key==="Escape"){close();}
  };
  inp.onblur=()=>setTimeout(close,0);
  wrap.onkeydown=null;
}

const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];};
const samePlace=(a,b)=>{const x=evPlace(a),y=evPlace(b);return !!x&&!!y&&(x===y||(Math.min(x.length,y.length)>=7&&lev(x,y)<=2));};
/* back-to-back events at the same place that share only the changeover day both count */
const backToBack=(a,b)=>((a.e===b.s&&a.s<b.s)||(b.e===a.s&&b.s<a.s))&&samePlace(a,b);
const evDays=e=>Math.round((Date.parse(e.e)-Date.parse(e.s))/864e5)+1;
/* When selections overlap, count one: earliest start, then fewer days, then the higher level. */
function attended(p){
  if(p._att) return p._att;
  const evs=[...new Set(p.asg.map(a=>a.e))].sort((a,b)=>a.s.localeCompare(b.s)||evDays(a)-evDays(b)||evRank(b)-evRank(a));
  const keep=[], clash=new Map(); const R=new Map(evs.map(e=>[e,rngOf(p,e)]));
  for(const e of evs){const [es,ee]=R.get(e);const c=keep.find(k=>{const [ks,ke]=R.get(k);return !(ee<ks||es>ke)&&!backToBack(e,k);}); if(c) clash.set(e,c); else keep.push(e);}
  return p._att={set:new Set(keep),clash};
}
function daysOf(evs,y,p){const days=new Set();const lo=Date.parse(y+"-01-01"),hi=Date.parse(y+"-12-31");
  evs.forEach(e=>{const [s,x]=p?rngOf(p,e):[e.s,e.e];for(let d=Math.max(Date.parse(s),lo);d<=Math.min(Date.parse(x),hi);d+=864e5)days.add(d);});return days.size;}
function daysIn(p,y){const days=new Set();const lo=Date.parse(y+"-01-01"),hi=Date.parse(y+"-12-31");
  attended(p).set.forEach(e=>{const [s,x]=rngOf(p,e);for(let d=Math.max(Date.parse(s),lo);d<=Math.min(Date.parse(x),hi);d+=864e5)days.add(d);});return days.size;}

  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;};
  size();
  const rBase=n=>2.2+Math.sqrt(nb.get(n).size)*0.45;
  const rOf=n=>rBase(n)/Math.pow(Math.max(1,tr.k),0.75); /* dots stay readable when zoomed in */
  const wPx=w=>w>=3?3.2:w===2?1.8:0.7;

  let tr=d3.zoomIdentity.translate(W/2,H/2).scale(0.6);
  let hover=null, focus=null; /* focus: {kind:"u",n} or {kind:"e",e,set} */
  const restore=()=>{if(!S.sel)return null;if(S.sel.kind==="u"){const n=nodes.find(x=>x.p===S.sel.ref);return n?{kind:"u",n}:null;}return evFocus(S.sel.ref);};
  function evFocus(e){const set=new Set(nodes.filter(n=>n.evs.includes(e)));return set.size?{kind:"e",e,set}:null;}
  focus=restore();
  const inFocus=n=>!focus||(focus.kind==="u"?(n===focus.n||nb.get(focus.n).has(n)):focus.set.has(n));
  const edgeOn=l=>!focus||(focus.kind==="u"?(l.source===focus.n||l.target===focus.n):(l.evs.includes(focus.e)&&focus.set.has(l.source)&&focus.set.has(l.target)));
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    ctx.translate(tr.x,tr.y);ctx.scale(tr.k,tr.k);
    // edges, grouped by width
    [1,2,3].forEach(w=>{
      ctx.lineWidth=wPx(w)/tr.k;ctx.strokeStyle=col.edge;
      ctx.globalAlpha=focus?0.06:(w===1?0.18:w===2?0.55:0.85);ctx.beginPath();
      links.forEach(l=>{const lw=Math.min(3,l.evs.length);if(lw!==w||(focus&&edgeOn(l)))return;ctx.moveTo(l.source.x,l.source.y);ctx.lineTo(l.target.x,l.target.y);});ctx.stroke();
      if(focus){ctx.globalAlpha=0.9;ctx.strokeStyle=col.ink;ctx.beginPath();links.forEach(l=>{if(Math.min(3,l.evs.length)!==w||!edgeOn(l))return;ctx.moveTo(l.source.x,l.source.y);ctx.lineTo(l.target.x,l.target.y);});ctx.stroke();}
    });
    nodes.forEach(n=>{const on=inFocus(n);ctx.globalAlpha=on?1:0.15;ctx.beginPath();ctx.arc(n.x,n.y,rOf(n),0,7);if(n.iu){ctx.fillStyle=col.u;ctx.fill();}else{ctx.fillStyle=col.bg;ctx.fill();ctx.lineWidth=1.4/tr.k;ctx.strokeStyle=col.u;ctx.stroke();}
      if((focus&&focus.kind==="u"&&n===focus.n)||n===hover){ctx.globalAlpha=1;ctx.lineWidth=2/tr.k;ctx.strokeStyle=col.sel;ctx.beginPath();ctx.arc(n.x,n.y,rOf(n)+2.5/tr.k,0,7);ctx.stroke();}});
    ctx.globalAlpha=1;ctx.textBaseline="middle";
    const lab=(n,txt,bold)=>{ctx.font=`${bold?700:600} ${(bold?13:11)/tr.k}px ${C("--f-body")}`;const x=n.x+rOf(n)+3/tr.k;ctx.lineWidth=3/tr.k;ctx.strokeStyle=col.bg;ctx.strokeText(txt,x,n.y);ctx.fillStyle=col.ink;ctx.fillText(txt,x,n.y);};
    const nm=n=>n.iu?`${iu5(n.iu)} ${n.p.sur}`:n.p.sur;
    if(focus){const list=focus.kind==="u"?[...nb.get(focus.n).keys()]:[...focus.set];if(list.length<=60||tr.k>=1.6)list.forEach(n=>lab(n,nm(n)));if(focus.kind==="u")lab(focus.n,nm(focus.n),true);}
    else if(tr.k>=2.4){nodes.forEach(n=>lab(n,nm(n)));}

  sel.call(zoom).call(zoom.transform,tr);
  const fitTo=(arr,dur)=>{if(!arr.length)return;const xs=arr.map(n=>n.x),ys=arr.map(n=>n.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const k=Math.min(3.2,0.86*Math.min(W/((x1-x0)||60),H/((y1-y0)||60)));const T0=d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k);
    dur?sel.transition().duration(dur).call(zoom.transform,T0):sel.call(zoom.transform,T0);};

  sim.on("tick",()=>{req();if(!fitted&&!userMoved&&sim.alpha()<0.08){fitted=true;fitTo(focusNodes(),600);}});
  const pick=ev=>{const [mx,my]=d3.pointer(ev,cv);const x=(mx-tr.x)/tr.k,y=(my-tr.y)/tr.k;let best=null,bd=Infinity;nodes.forEach(n=>{const d=Math.hypot(n.x-x,n.y-y);if(d<rOf(n)+6/tr.k&&d<bd){bd=d;best=n;}});return {n:best,mx,my};};
  const tipHtml=n=>{let s=`<b>${esc(netName(n))}</b><br>${t.gr_u_n(n.evs.length)} · ${colTxt(n)}`;
    if(focus&&focus.kind==="u"&&n!==focus.n&&nb.get(focus.n).has(n)){const l=nb.get(focus.n).get(n);s+=`<br>${t.gr_shared(l.evs.length)}: ${l.evs.map(e=>esc(evName(e))).join("; ")}`;}return s;};
  cv.addEventListener("pointermove",ev=>{const {n,mx,my}=pick(ev);if(n!==hover){hover=n;req();}
    if(n){tip.innerHTML=tipHtml(n);tip.hidden=false;tip.style.left=Math.min(Math.max(mx,140),W-140)+"px";tip.style.top=my+"px";}else tip.hidden=true;},sig);
  cv.addEventListener("pointerleave",()=>{hover=null;tip.hidden=true;req();},sig);
  const setFocus=f=>{focus=f;S.sel=!f?null:f.kind==="u"?{kind:"u",ref:f.n.p}:{kind:"e",ref:f.e};const ge=$("#gev");if(ge)ge.value=f&&f.kind==="e"?hebEvLabel(f.e):"";side();req();};

  function side(){

    if(focus.kind==="u"){const n=focus.n;const list=[...nb.get(n).entries()].sort((a,b)=>b[1].evs.length-a[1].evs.length||a[0].p.sur.localeCompare(b[0].p.sur));
      box.innerHTML=`<h3 style="margin:0">${esc(netName(n))}</h3>
      <p class="muted" style="font-size:13px;margin:4px 0 0">${t.gr_u_n(n.evs.length)} · ${colTxt(n)} · <a href="${href(n.p)}">${t.gr_open}</a></p>
      <p style="font-size:13px;margin:8px 0 0">${n.evs.slice().sort((a,b)=>b.s.localeCompare(a.s)).map(e=>`<a href="#e${e.i}">${esc(evName(e))}</a>`).join(" · ")}</p>
      ${S.min>1?`<h4 class="eyebrow" style="margin:14px 0 0">${t.gr_strong_h}</h4>`:""}<div class="gl">${list.map(([m,l])=>`<a href="#" data-gn="${m.id}"><span><span class="n">${esc(netName(m))}</span><span class="s">${l.evs.map(e=>esc(evName(e))).join(" · ")}</span></span><span class="w">${l.evs.length}</span></a>`).join("")}</div>`;}
    else{const list=[...focus.set].sort((a,b)=>a.p.sur.localeCompare(b.p.sur));
      box.innerHTML=`<h3 style="margin:0">${esc(evName(focus.e))}</h3><p class="muted" style="font-size:13px;margin:4px 0 0">${fmtRange(focus.e.s,focus.e.e)} · ${t.gr_ev_n(list.length)} · <a href="#e${focus.e.i}">${t.gr_open}</a></p>

  {const ge=$("#gev"), evS=hebEvents(full).filter(e=>evAll.includes(e));

async function loadInbox(){
  if(!CAP.db||!CAP.admin) return;
  const markers=await CAP.db.collection("inbox").get();
  const all=[];
  for(const m of markers.docs){const s=await CAP.db.collection("inbox/"+m.id+"/items").get();s.docs.forEach(d=>all.push({id:d.id,path:"inbox/"+m.id+"/items/"+d.id,...d.data()}));}
  INBOX=all;
}
async function wireInbox(){
  if(!/^#inbox$/.test(location.hash)) return;
  if(CAP.admin&&CAP.db&&!inboxSub){inboxSub=CAP.db.collection("inbox").onSnapshot(async()=>{await loadInbox();route(true);},()=>{});}
  document.querySelectorAll("[data-ibx]").forEach(b=>b.onclick=()=>{inboxState.show=b.dataset.ibx;route(true);});
  const rf=$("#ibxRefresh");if(rf)rf.onclick=async()=>{await loadInbox();route(true);};
  const set=async(path,patch)=>{await CAP.db.doc(path).update({...patch,reviewedAt:Date.now(),reviewer:CAP.uid});await loadInbox();route(true);};
  document.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{b.disabled=true;const x=INBOX.find(y=>y.path===b.dataset.acc);if(!x)return;
    try{if(x.kind==="was")await CAP.db.collection("approved").add({kind:"was",ei:x.ei,ev:x.ev,who:x.who,role:x.role,ds:x.ds,de:x.de,from:x.path,at:Date.now()});
      await set(x.path,{status:"accepted"});}catch(_){b.disabled=false;alert(T().st_fail);}});
  document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await set(b.dataset.rej,{status:"rejected"});}catch(_){b.disabled=false;}});
  document.querySelectorAll("[data-reopen]").forEach(b=>b.onclick=async()=>{b.disabled=true;const x=INBOX.find(y=>y.path===b.dataset.reopen);
    try{const ap=APPROVED.filter(a=>a.from===x.path);for(const a of ap)await CAP.db.doc("approved/"+a.id).delete();await set(x.path,{status:"pending"});}catch(_){b.disabled=false;}});
  const ids=[...new Set([...document.querySelectorAll("[data-prof]")].map(d=>d.dataset.prof).filter(Boolean))];
  if(ids.length&&CAP.user&&CAP.user.profiles){try{const ps=await CAP.user.profiles(ids);document.querySelectorAll("[data-prof]").forEach(d=>{const p=ps[d.dataset.prof];if(p&&p.name)d.textContent=p.name;});}catch(_){}}
}

function viewEvent(e){

  const ctry=new Set(e.ump.map(u=>u.p.c?u.p.c.i:u.p.cname));
  const days=Math.round((Date.parse(e.e)-Date.parse(e.s))/864e5)+1;
  const evSrc=[...new Set(e.ump.concat(e.ref).filter(u=>u.src!=null).map(u=>u.src))];

/* ---------- Olympics: officials at the Olympic and Paralympic Games ---------- */
function olyProf(k){
  if(k.startsWith("n:")) return EXTRA.find(x=>"n:"+x.sur+"|"+x.first===k)||null;
  const fromRef=r=>r?(r.o||r):null;
  if(k[0]==="r") return fromRef(REFS.find(x=>"r"+x.ir===k));
  const n=+k; return BYIU.get(n)||EXTRA.find(x=>x.iuX===n)||fromRef(REFS.find(x=>x.iuR===n||(x.o&&x.o.iu===n)))||null;
}
let OLY_ROWS=null;
function olyRows(){
  if(OLY_ROWS) return OLY_ROWS;
  const seen=new Set(), rows=[];
  for(const k of new Set(Object.keys(OLY).concat(Object.keys(PARA)))){
    const p=olyProf(k);
    if(p){ if(seen.has(p)) continue; seen.add(p);
      const part=olyYears(p)||[]; if(!part.length) continue;
      rows.push({sur:p.sur,first:p.first||"",code:(p.c&&p.c.code)||p.code||"",cname:p.c?p.c.name:(p.cname||""),go:href(p),iu:p.isRef?(p.iuR||0):p.x?(p.iuX||0):p.iu,part});
    } else { const nm=OLY_NAMES[k]||[k,"",""];
      const part=[...(OLY[k]||[]).map(x=>[x[0],x[1],x[2],"og"]),...(PARA[k]||[]).map(x=>[x[0],x[1],x[2],"pg"])];
      rows.push({sur:nm[0],first:nm[1],code:nm[2],cname:(COUNTRIES.find(c=>c.code&&c.code===nm[2])||{}).name||nm[3]||"",go:null,iu:/^\d+$/.test(k)?+k:0,part});
    }
  }
  rows.forEach(r=>{r.part.sort((a,b)=>a[0]-b[0]||(a[3]<b[3]?-1:1));r.n=new Set(r.part.map(x=>x[3]+x[0])).size;r.key=(r.sur+" "+r.first+" "+r.first+" "+r.sur+" "+(r.iu?String(r.iu).padStart(5,"0"):"")).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();});
  return OLY_ROWS=rows;
}

function renderOlyRows(){
  const ru=LANG==="ru", R=GAMES_ROLE(ru), S=OLY_STATE;
  const q=S.q.trim().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const match=x=>(!S.g||x[3]+"|"+x[0]===S.g)&&(!S.r||x[1]===S.r);
  let rows=olyRows().filter(p=>(!q||q.split(/\s+/).every(w=>p.key.includes(w)))&&p.part.some(match));
  rows.sort(S.sort==="games"?(a,b)=>b.n-a.n||a.sur.localeCompare(b.sur):S.sort==="first"?(a,b)=>a.part[0][0]-b.part[0][0]||a.sur.localeCompare(b.sur):(a,b)=>a.sur.localeCompare(b.sur)||a.first.localeCompare(b.first));
  const parts=rows.reduce((s,p)=>s+p.part.filter(match).length,0);
  $("#olyN").textContent=ru?`Найдено: ${rows.length} ${plural(rows.length,"человек","человека","человек")}, ${parts} ${plural(parts,"участие","участия","участий")}`:`Found: ${rows.length} ${rows.length===1?"person":"people"}, ${parts} ${parts===1?"appointment":"appointments"}`;
  const chip=x=>{const on=match(x);return `<span class="ogc${on?"":" off"}" title="${esc(GAMES_SRC(ru)[x[2]]||"")}"><b>${x[3]==="pg"?(ru?"ПИ":"PG"):(ru?"ОИ":"OG")} ${x[0]}</b> ${esc(R[x[1]]||x[1])}</span>`;};
  $("#olyRows").innerHTML=rows.length?rows.map(p=>`<tr${p.go?` data-go="${p.go.slice(1)}"`:` class="nolink"`}><td>${p.go?`<a href="${p.go}">${esc(p.sur)}</a>`:`<span>${esc(p.sur)}</span>`} ${esc(p.first)}${p.iu?` <span class="num muted" style="font-size:12px">${String(p.iu).padStart(5,"0")}</span>`:""}</td><td>${p.cname?esc(p.cname)+" ":""}${p.code?`<span class="code">${esc(p.code)}</span>`:""}</td><td class="ogcell">${p.part.map(chip).join("")}</td></tr>`).join(""):`<tr class="nolink"><td colspan="3" class="muted">${ru?"Под эти фильтры никого нет.":"Nobody matches these filters."}</td></tr>`;
}
function wireOly(){
  if(!$("#olyRows")) return;
  const S=OLY_STATE;
  $("#olyQ").addEventListener("input",e=>{S.q=e.target.value;renderOlyRows();});
  [["#olyG","g"],["#olyR","r"],["#olyS","sort"]].forEach(([id,k])=>$(id).addEventListener("change",e=>{S[k]=e.target.value;renderOlyRows();}));

}

const toDoc=r=>Object.assign({},r.data||{},{id:r.id,status:r.status,at:Number(r.at)||0,by:r.uid,reviewedAt:r.reviewed_at?Number(r.reviewed_at):undefined,reviewer:r.reviewer||undefined});
const toAppr=r=>Object.assign({},r.data||{},{id:r.id,at:Number(r.at)||0,from:r.from_path||undefined});
const asSnap=list=>({docs:list.map(x=>({id:x.id,data(){const c=Object.assign({},x);delete c.id;return c;}}))});
const dbFail=e=>({code:/row-level|permission|denied|42501/i.test(String((e&&(e.code||e.message))||""))?"invalid_argument":"fail"});

/* initial load + realtime; returns an unsubscribe function */
function supaLive(key,table,load){
  let stop=false;
  const run=()=>{if(!stop)Promise.resolve(load()).catch(()=>{});};
  run();
  const ch=SB.channel("rt-"+key).on("postgres_changes",{event:"*",schema:"public",table},run).subscribe();
  return ()=>{stop=true;try{SB.removeChannel(ch);}catch(_){}};
}

function supaDb(){
  const mine=async uid=>{const {data,error}=await SB.from("submissions").select("*").eq("uid",uid).order("at",{ascending:false});if(error)throw error;return (data||[]).map(toDoc);};
  const all=async()=>{const {data,error}=await SB.from("approved").select("*");if(error)throw error;return (data||[]).map(toAppr);};
  const uids=async()=>{const {data,error}=await SB.from("submissions").select("uid");if(error)throw error;return [...new Set((data||[]).map(r=>r.uid))];};
  return {
    collection(path){
      if(path==="approved") return {
        async get(){return asSnap(await all());},
        async add(doc){const {error}=await SB.from("approved").insert({at:doc.at||Date.now(),from_path:doc.from||null,data:doc});if(error)throw dbFail(error);},
        onSnapshot(cb,err){return supaLive("approved","approved",async()=>{try{cb(asSnap(await all()));}catch(e){if(err)err(e);}});}
      };
      if(path==="inbox") return {
        async get(){return idSnap(await uids());},
        onSnapshot(cb,err){return supaLive("inbox","submissions",async()=>{try{cb(idSnap(await uids()));}catch(e){if(err)err(e);}});}
      };
      const mi=/^inbox\/([^/]+)\/items$/.exec(path);
      if(mi){const uid=mi[1];return {
        async get(){return asSnap(await mine(uid));},
        async add(doc){const {error}=await SB.from("submissions").insert({uid,status:doc.status||"pending",at:doc.at||Date.now(),data:doc});if(error)throw dbFail(error);},
        onSnapshot(cb,err){return supaLive("items-"+uid,"submissions",async()=>{try{cb(asSnap(await mine(uid)));}catch(e){if(err)err(e);}});}
      };}
      return {async get(){return asSnap([]);},async add(){throw {code:"fail"};},onSnapshot(){return ()=>{};}};
    },
    doc(path){
      const md=/^inbox\/[^/]+\/items\/([^/]+)$/.exec(path);
      const ma=/^approved\/([^/]+)$/.exec(path);
      return {
        async set(){/* submitter markers are derived from submissions */},
        async update(patch){
          if(!md) return;
          const row={}, rest={};
          for(const k in patch){
            if(k==="status") row.status=patch[k];
            else if(k==="reviewedAt") row.reviewed_at=patch[k];
            else if(k==="reviewer") row.reviewer=patch[k]||null;
            else rest[k]=patch[k];
          }
          if(Object.keys(rest).length){const {data}=await SB.from("submissions").select("data").eq("id",md[1]).single();row.data=Object.assign({},(data&&data.data)||{},rest);}
          const {error}=await SB.from("submissions").update(row).eq("id",md[1]);if(error)throw dbFail(error);
        },
        async delete(){if(!ma)return;const {error}=await SB.from("approved").delete().eq("id",ma[1]);if(error)throw dbFail(error);}
      };
    }
  };

  {const cu=e.target.closest("[data-cup]");if(cu){openEvModal("loc",null,CBYCODE.get(cu.dataset.cup));return;}}
  if(e.target.closest("[data-find]")){const q=$("#q");if(q){q.scrollIntoView({block:"center",behavior:"smooth"});q.focus({preventScroll:true});}return;}
  const ea=e.target.closest("[data-evact]"); if(ea){openEvModal(ea.dataset.evact,+ea.dataset.ei);return;}
  if(!e.target.closest(".search")){const r=$("#res");if(r)r.hidden=true;}
});
$("#claimBtn").onclick=()=>{const m=/^#u(\d+)$/.exec(location.hash);openModal("claim",m?m[1]:null);};
window.addEventListener("hashchange",()=>route(false));
route(false);
</script>
</body></html>
